name: Release Charts

# Releasing is deliberate, not a side effect of merging.
#
# Previously three near-identical workflows fired on push to main behind a
# per-chart path filter, so any merge touching charts/ published whatever
# version happened to be in Chart.yaml. That makes the version bump the
# release trigger, which is easy to do by accident in a PR and impossible to
# stage: you cannot land a chart change and release it later.
#
# Now a release happens only when a v* tag is pushed. chart-releaser walks
# every chart and, with skip_existing, publishes only those whose version has
# no release yet — so one tag releases exactly the charts whose Chart.yaml
# version moved since the last one.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: helm-chart-release
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 20
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # A tag can point anywhere. Releasing from a commit that never landed on
      # main would publish a chart that does not exist on the default branch.
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main"

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add repositories for dependencies
        run: |
          # Every non-OCI dependency repository must be here. dragonfly is OCI
          # and needs no `repo add`; cert-manager is not, and without jetstack
          # `helm dependency build` cannot resolve it at all.
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Build chart dependencies
        run: |
          # No `|| true`. Swallowing this is how a release ships a chart with
          # an EMPTY charts/ directory: dependency build fails, chart-releaser
          # packages whatever is on disk, and the published chart renders none
          # of its subcharts - silently, because a gated subchart that is
          # simply absent looks exactly like one that is turned off.
          set -euo pipefail
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm dependency build "$chart"
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
