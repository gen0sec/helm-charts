name: Validate Charts

# The repo had no PR-time validation at all — the only workflows were release
# ones. Now that releasing is gated behind a tag, a broken chart can sit on
# main unnoticed until someone tags, so the checks have to run earlier.
on:
  pull_request:
    paths:
      - 'charts/**'
      - 'README.md'
      - 'hack/**'
      - '.github/workflows/validate-charts.yaml'
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'README.md'
      - 'hack/**'
  workflow_dispatch:

# Checkout and read-only checks only; nothing here comments, pushes or releases.
permissions:
  contents: read

concurrency:
  group: validate-charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-template:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add repositories for dependencies
        run: |
          # Keep in step with release-charts.yaml. dragonfly is OCI and needs
          # no `repo add`; cert-manager needs jetstack.
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      # Strict on purpose: no `|| helm dependency update` fallback. That
      # fallback rewrote a stale Chart.lock in place, so every later step ran
      # against a repaired tree instead of the one being merged.
      - name: Build chart dependencies
        run: |
          set -euo pipefail
          # Charts that others pull in via file:// go first. The glob sorts
          # synapse-stack before synapse, and a parent bundles its file://
          # subchart as it is on disk: built too early, the stack carries
          # synapse WITHOUT its own subcharts and every later step passes
          # against an incomplete stack.
          # grep exits 1 when no chart has a file:// dependency: that is not an error;
          # without it, pipefail would end the step there with no message.
          first=$({ grep -hoE 'file://\.\./[^"[:space:]]+' charts/*/Chart.yaml || [ "$?" -eq 1 ]; } | sed 's|file://\.\./||' | sort -u | tr '\n' ' ')
          for name in $first; do
            helm dependency build "charts/$name"
          done
          for chart in charts/*/; do
            name=$(basename "$chart")
            [ -f "$chart/Chart.yaml" ] || continue
            case " $first" in *" $name "*) continue ;; esac
            helm dependency build "$chart"
          done

      - name: helm lint
        run: |
          rc=0
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            echo "::group::lint $chart"
            helm lint "$chart" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: helm template (default values)
        run: |
          rc=0
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            echo "::group::template $chart"
            helm template release-name "$chart" >/dev/null || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # Overlays are the configurations people actually deploy, and they use
      # value paths the defaults never exercise. Globbed rather than listed so
      # a new overlay is covered without touching this workflow.
      - name: helm template (example overlays)
        run: |
          rc=0
          shopt -s nullglob
          found=0
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            for values in "$chart"examples/*.yaml; do
              found=1
              echo "::group::template $chart -f $values"
              helm template release-name "$chart" -f "$values" >/dev/null || rc=1
              echo "::endgroup::"
            done
          done
          [ "$found" = 1 ] || echo "no example overlays found"
          exit $rc

  readme-versions:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README chart table matches Chart.yaml
        run: hack/check-readme.sh

      - name: shellcheck hack scripts
        run: shellcheck hack/*.sh

  operator-chart:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # The harness diffs the render against the base commit's chart, so it
      # needs the history. yq (v4) and git come with the runner.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: shellcheck
        run: shellcheck hack/check-operator-chart.sh

      # BASE is empty off a pull request (push, dispatch); the script then
      # skips the comparison with the base and runs the other cases.
      - name: Check the synapse-operator chart
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: hack/check-operator-chart.sh

  version-bumped:
    timeout-minutes: 15
    # Releases are tag-driven and chart-releaser skips versions that already
    # have a release, so an unbumped chart is published as SILENCE: the tag
    # succeeds and ships nothing. Catch it at review time instead.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Require a Chart.yaml version bump for every changed chart
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          for chart in charts/*/; do
            name=$(basename "$chart")
            [ -f "$chart/Chart.yaml" ] || continue

            if git diff --quiet "$BASE" "$HEAD" -- "$chart"; then
              continue          # chart untouched
            fi

            new=$(git show "$HEAD:${chart}Chart.yaml" | awk '/^version:/{print $2; exit}')
            if ! old=$(git show "$BASE:${chart}Chart.yaml" 2>/dev/null | awk '/^version:/{print $2; exit}'); then
              echo "new chart $name at $new"
              continue          # chart added in this PR
            fi

            if [ "$old" = "$new" ]; then
              echo "::error file=${chart}Chart.yaml::$name changed but version is still $old - bump it, or the release tag will skip this chart"
              rc=1
            else
              echo "$name $old -> $new"
            fi
          done
          exit $rc
