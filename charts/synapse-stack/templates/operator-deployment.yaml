{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-operator
  namespace: {{ .Values.global.namespaces.operator }}
  labels:
    app.kubernetes.io/name: synapse-operator
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse-operator
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-operator
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ default "synapse-operator" .Values.operator.serviceAccount.name }}
      containers:
        - name: manager
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            {{- if .Values.operator.leaderElect }}
            - --leader-elect
            {{- end }}
            {{- if .Values.operator.labelSelector }}
            - --label-selector={{ .Values.operator.labelSelector }}
            {{- end }}
            {{- if .Values.operator.configHashAnnotation }}
            - --config-hash-annotation={{ .Values.operator.configHashAnnotation }}
            {{- end }}
            {{- if .Values.operator.ignoreConfigMapKeys }}
            - --ignore-configmap-keys={{ .Values.operator.ignoreConfigMapKeys }}
            {{- end }}
            {{- if .Values.operator.ignoreSecretKeys }}
            - --ignore-secret-keys={{ .Values.operator.ignoreSecretKeys }}
            {{- end }}
            {{- if .Values.operator.upstreamsResolver }}
            - --upstreams-resolver
            {{- end }}
            {{- if .Values.operator.netvarsResolver }}
            - --netvars-resolver
            {{- end }}
            {{- if .Values.operator.idsHotReloadHashExclude }}
            - --ids-hot-reload-hash-exclude
            {{- end }}
            {{- if .Values.operator.perWorkloadConfigHash }}
            - --per-workload-config-hash
            {{- end }}
            {{- if or .Values.operator.identityProducer.enabled .Values.operator.edgeProducer.enabled }}
            - --download-api-url={{ .Values.operator.downloadAPIURL }}
            {{- end }}
            {{- if .Values.operator.identityProducer.enabled }}
            - --identity-producer
            {{- with .Values.operator.identityProducer.interval }}
            - --identity-producer-interval={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.operator.edgeProducer.enabled }}
            - --edge-producer
            {{- with .Values.operator.edgeProducer.interval }}
            - --edge-producer-interval={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.operator.graphProducer.enabled }}
            - --graph-producer
            - --service-graph-url={{ .Values.operator.graphProducer.serviceGraphURL }}
            {{- with .Values.operator.graphProducer.interval }}
            - --graph-producer-interval={{ . }}
            {{- end }}
            {{- end }}
            {{- with .Values.operator.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.operator.identityProducer.enabled .Values.operator.edgeProducer.enabled .Values.operator.graphProducer.enabled }}
          env:
            # API key with identity:write — the producers PUT to download-api /
            # service-graph-api with a Bearer token.
            - name: SYNAPSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.apiKeySecret.name }}
                  key: {{ .Values.operator.apiKeySecret.key }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
