{{- /*
synapse-class Ingresses consumed by the --ingress-mode operator
(operator-ingress-deployment.yaml) and rendered into the proxy's
upstreams.yaml. Each Ingress must live in the SAME namespace as its backend
Services (the operator resolves backends within the Ingress's namespace).
Driven by .Values.routing.ingresses so routes live in values, not templates.
*/ -}}
{{- range $ing := .Values.routing.ingresses }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ing.name }}
  namespace: {{ $ing.namespace }}
  labels:
    app.kubernetes.io/managed-by: synapse-stack
    app.kubernetes.io/component: routing
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.ingressClassName | default "synapse" }}
  rules:
    - host: {{ $ing.host }}
      http:
        paths:
          {{- range $p := $ing.paths }}
          - path: {{ $p.path | quote }}
            pathType: {{ $p.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $p.service }}
                port:
                  number: {{ int $p.port }}
          {{- end }}
{{- end }}
