{{- if and .Values.operator.enabled .Values.operator.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: synapse-operator
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    # UpstreamsResolver writes `<source>-resolved` siblings; NetVarsResolver
    # rewrites the agent config CM in place. Both need write verbs.
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    # NetVarsResolver (--netvars-resolver) reads Node IPs + PodCIDRs to
    # auto-fill ids.address_vars.HOME_NET/EXTERNAL_NET.
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    # NetVarsResolver also collects LoadBalancer Service VIPs into HOME_NET
    # (a source-rewriting edge LB makes the agent see the LB IP as source).
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    # Required by the --ingress-mode operator rendered in
    # operator-ingress-deployment.yaml, which runs on this same
    # ServiceAccount.
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    # --publish-status-address writes .status.loadBalancer.ingress.
    verbs: ["get", "update", "patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    # --resolve-backend-endpoints renders ready pod IPs as the server list
    # so upstreams carry literals and pod churn re-renders immediately.
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
{{- end }}
