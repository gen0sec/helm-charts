apiVersion: v2
name: synapse-stack
description: Umbrella chart that installs the Synapse dataplane together with the Synapse operator
# Release synapse-stack v0.1.2
type: application
version: 0.1.5
appVersion: "0.7.0"
home: https://gen0sec.com
icon: https://raw.githubusercontent.com/gen0sec/helm-charts/main/images/logo.png
sources:
  - https://github.com/gen0sec/synapse
  - https://github.com/gen0sec/synapse-operator
keywords:
  - synapse
  - operator
  - kubernetes
  - security
  - proxy
  - firewall
dependencies:
  # One umbrella release → TWO workloads from the same `synapse` subchart,
  # aliased so each gets its own values tree + identity:
  #   proxy  → synapse-proxy (TLS passthrough / L7 / Tier-2 terminate)
  #   agent  → synapse-agent (XDP transparent observe; edge only)
  - name: synapse
    version: 0.1.4
    repository: "file://../synapse"
    alias: proxy
    condition: proxy.enabled
  - name: synapse
    version: 0.1.4
    repository: "file://../synapse"
    alias: agent
    condition: agent.enabled
maintainers:
  - name: Gen0Sec
    email: support@gen0sec.com
