# Unified namespace for the synapse stack: dataplane (proxy + agent),
# operator, and the rendered upstreams ConfigMap all land in the same
# place. Older deployments split these across `synapse-system` /
# `ingress-synapse` / `synapse` — pick `synapse-os` for greenfield.
global:
  namespaces:
    synapse: synapse-os
    operator: synapse-os

# Two aliased instances of the `synapse` subchart (see Chart.yaml).
# `nameOverride` sets app.kubernetes.io/name (the per-workload
# disambiguator, since app.kubernetes.io/instance == release name is
# shared); `fullnameOverride` forces the bare resource/pod name so pods
# are `synapse-proxy-*` / `synapse-agent-*` (NOT `<release>-synapse-*`).
# clamav/dragonfly are unused here (content_scanning + redis off in the
# rendered config) and gated off so aliasing doesn't double them. Both aliases
# also carry a distinct `dragonfly.fullnameOverride`: that name is derived from
# the release name, which the two aliases share, so enabling Dragonfly on both
# without it renders one ServiceAccount/Service/Deployment twice.
proxy:
  enabled: true
  nameOverride: synapse-proxy
  fullnameOverride: synapse-proxy
  clamavIntegration:
    enabled: false
  dragonfly:
    enabled: false
    fullnameOverride: synapse-proxy-dragonfly

agent:
  enabled: false
  nameOverride: synapse-agent
  fullnameOverride: synapse-agent
  # Mark the agent config CM so the operator's NetVarsResolver fills the
  # IDS HOME_NET/EXTERNAL_NET (requires operator.netvarsResolver: true).
  configMapExtraLabels:
    synapse.gen0sec.com/resolve-netvars: "true"
  # The agent is an XDP DaemonSet: it has no content-scanning path and no
  # Redis-backed features, so neither store nor scanner is ever reachable
  # from it. Both are off by default now; kept explicit here so aliasing
  # cannot reintroduce them.
  clamavIntegration:
    enabled: false
  dragonfly:
    enabled: false
    fullnameOverride: synapse-agent-dragonfly

operator:
  enabled: true
  createNamespace: true
  image:
    repository: ghcr.io/gen0sec/synapse-operator
    # Must be >= 0.1.11: that is where --config-sync and
    # --resolve-backend-endpoints were added, and this chart passes
    # --resolve-backend-endpoints by default. An older image exits 2
    # on the unknown flag and the operator CrashLoopBackOffs.
    tag: "0.1.11"
    pullPolicy: IfNotPresent
  # Pull secrets for the operator's own images. Separate from the subcharts'
  # imagePullSecrets: the operator is deployed by THIS chart's templates, not by
  # the synapse subchart, so proxy./agent.imagePullSecrets never reached it and
  # --set operator.imagePullSecrets was accepted and silently discarded.
  #
  # Needed whenever operator.image.repository is private — e.g. pulling from
  # registry.gen0sec.com rather than a public mirror.
  imagePullSecrets: []
  replicaCount: 1
  leaderElect: true
  # Set-based: both workloads' name labels differ (synapse-proxy /
  # synapse-agent) so the operator must match either, or it silently
  # stops config-hash rolling BOTH (it filters List by this selector).
  labelSelector: "app.kubernetes.io/name in (synapse-proxy,synapse-agent)"
  configHashAnnotation: "synapse.gen0sec.com/config-hash"
  ignoreConfigMapKeys: "upstreams.yaml"
  ignoreSecretKeys: ""
  # Enable the UpstreamsResolver — substitutes Service FQDNs to ClusterIPs
  # in ConfigMaps labelled `synapse.gen0sec.com/resolve-upstreams=true`.
  upstreamsResolver: false
  # Enable the NetVarsResolver — fills IDS HOME_NET/EXTERNAL_NET in agent
  # config ConfigMaps labelled `synapse.gen0sec.com/resolve-netvars=true`
  # from Node IPs + PodCIDRs + RFC1918 supernets, so inline IDS blocking
  # never bans an internal source IP. A manual HOME_NET in the config or
  # the `synapse.gen0sec.com/home-net` annotation overrides auto-discovery.
  netvarsResolver: false
  # Exclude hot-reloadable IDS fields from the config-hash so HOME_NET/
  # enforce_block/rules changes don't roll the agent (it hot-reloads them).
  # Only enable once all agents run a hot-reload-capable synapse image (r32+).
  idsHotReloadHashExclude: false
  # Per-workload config-hash: only roll a workload when ITS referenced config
  # changes (not any namespace config). Avoids agent-rule changes rolling proxy.
  perWorkloadConfigHash: false
  # Extra raw args appended to the manager invocation.
  extraArgs: []
  # ----- East-west producers (off by default) -----
  # Each producer needs an API key with identity:write, from apiKeySecret.
  downloadAPIURL: "https://api.gen0sec.com/v1"
  apiKeySecret:
    name: synapse-operator-api-key
    key: SYNAPSE_API_KEY
  # IdentityProducer: pod IP -> workload MMDB, uploaded to download-api.
  identityProducer:
    enabled: false
    interval: "" # e.g. 60s; empty = operator default
  # EdgeProducer: NetworkPolicy -> declared-edge allow-list, uploaded to download-api.
  edgeProducer:
    enabled: false
    interval: ""
  # GraphProducer: uploads identities + edges to service-graph-api, which writes
  # the AGE service_graph. The operator stays REST-only (no DB).
  graphProducer:
    enabled: false
    interval: ""
    serviceGraphURL: "http://service-graph-api.services.svc.cluster.local:9999"
  # ----- Ingress-mode controller (SEPARATE Deployment) -----
  # When enabled, deploy a second operator in --ingress-mode that renders the
  # synapse-class Ingresses in `.routing.ingresses` into the proxy's
  # upstreams.yaml ConfigMap key, cluster-wide. It runs ALONGSIDE the
  # config-hash operator above (ingress-mode replaces config-hash within one
  # process, so they are separate Deployments sharing one ServiceAccount).
  # IMPORTANT: when enabled, also set `proxy.synapse.upstreams: ""` so the
  # operator owns the routes (the chart then stops templating that key to
  # avoid a Helm 3-way-merge clobber on upgrade).
  ingress:
    enabled: false
    replicaCount: 1
    ingressClass: synapse
    # "<namespace>/<name>" of the proxy ConfigMap whose upstreams.yaml key the
    # operator renders. REQUIRED when ingress.enabled.
    upstreamsOutConfigMap: ""
    clusterDomain: cluster.local
    # Emit backend ClusterIP:port instead of the Service FQDN (skips per-
    # request DNS); falls back to FQDN for headless / unallocated Services.
    resolveBackendClusterIPs: false
    # Default ON from synapse chart 0.5.0. Renders the READY pod IPs from
    # EndpointSlices as the server list instead of a single Service address,
    # so the proxy connects straight to pods and a replaced pod is picked up
    # on the next render rather than after synapse's DNS-cache TTL.
    #
    # REQUIRES a synapse build carrying the atomic reload-publication fix.
    # Endpoint rendering re-renders on pod churn, so a rollout that used to
    # produce no reloads now produces one per endpoint event; against an older
    # proxy that multiplies exposure to a reload race that can 502. If you pin
    # image.tag to a release older than that fix, set this back to false.
    #
    # Also strongly prefers the config-sync sidecar. In central mode every
    # re-render is a ConfigMap write, and without the sidecar each one waits
    # out kubelet's mount sync (~1m) - you pay the churn without the
    # freshness. See examples/config-sync-values.yaml.
    #
    # Falls back to ClusterIP/FQDN when the endpoint set is missing or empty
    # (ExternalName, headless, scaled to zero), so a route is never blanked.
    resolveBackendEndpoints: true
    # Also reconcile Gateway API (GatewayClass/Gateway/HTTPRoute) into the same
    # upstreams render. Requires the Gateway API CRDs to be installed. Drives
    # both the --gateway-api flag and its RBAC, so the two cannot drift.
    gatewayAPI: false
    extraArgs: []
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ----- Native Kubernetes routing (synapse-class Ingresses) -----
# Consumed by the --ingress-mode operator (operator.ingress.enabled) and
# rendered into the proxy upstreams.yaml. Each entry becomes one Ingress; it
# MUST be in the same namespace as its backend Services. Empty by default —
# see examples/ingress-mode-values.yaml for a full set. Regex paths use
# pathType ImplementationSpecific + the nginx use-regex annotation.
routing:
  ingresses: []
