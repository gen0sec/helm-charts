{{- /*
config.yaml lives here by default, but moves to a Secret when
`synapse.configSecret` is set - see secret-config.yaml. Only the credential-
free keys stay in a ConfigMap in that mode.
*/ -}}
{{- if not (and .Values.synapse.configSecret (not .Values.synapse.upstreams)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synapse.fullname" . }}
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    {{- with .Values.configMapExtraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configMapExtraAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- if not .Values.synapse.configSecret }}
  config.yaml: |
{{ .Values.synapse.config | nindent 4 }}
  {{- end }}
  {{- /* When the --ingress-mode operator owns this ConfigMap's
         upstreams.yaml key (set synapse.upstreams to empty), the chart must
         NOT template the key - otherwise Helm's 3-way merge would clobber the
         operator-rendered routes on every upgrade. */}}
  {{- if .Values.synapse.upstreams }}
  upstreams.yaml: |
{{ .Values.synapse.upstreams | nindent 4 }}
  {{- end }}
{{- end }}
