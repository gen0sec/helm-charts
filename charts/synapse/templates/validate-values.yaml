{{- /*
Renders nothing; exists to fail fast on values that no longer do anything.

Helm silently accepts unknown keys, which is exactly how the valkey bug
survived: the umbrella set `valkey.enabled: false` for both aliases and got a
valkey Deployment anyway, because the dependency had no condition. A stale
`valkey:` block after this migration would fail the same quiet way, so turn
it into an error with the replacement spelled out.
*/ -}}
{{- if .Values.valkey }}
{{- fail (printf "`valkey` is no longer a dependency of this chart - it was replaced by Dragonfly. Rename the block to `dragonfly` (and note it is now gated: set `dragonfly.enabled: true` to deploy it, which valkey never respected). Offending values: %v" (keys .Values.valkey | sortAlpha)) }}
{{- end }}

{{- /*
Dragonfly with auth on cannot be auto-wired: the URL this chart injects carries
no credentials, and REDIS_URL overrides whatever the config file said, so the
result would be a proxy that authenticates to nothing and fails at connect time
with no hint as to why. Make it a render error with the two ways out.
*/ -}}
{{- if and (include "synapse.autoRedisUrl" .) (dig "passwordFromSecret" "enable" false (.Values.dragonfly | default dict)) }}
{{- fail "dragonfly.passwordFromSecret.enable is true, so the auto-wired REDIS_URL would connect without credentials. Either set `env.REDIS_URL` to a URL that carries them (redis://:<password>@host:6379/0), or set `redis.autoWire: false` and point `proxy.redis.url` in `synapse.config` at Dragonfly yourself." }}
{{- end }}

{{- /*
Credentials templated into config.yaml end up in a ConfigMap, the
last-applied-configuration annotation, and `helm get values`. Fail rather than
letting it pass silently - this is exactly the shape that put a production
api_key in cleartext.

This is a hard fail with an explicit escape hatch, not a warning: Helm has no
way to emit a warning that anyone reliably sees, so the choice is between
failing and saying nothing. An install that cannot migrate yet can set
`allowConfigCredentials: true` to keep rendering, which at least makes the
exposure a recorded decision rather than an accident.
*/ -}}
{{- if not .Values.allowConfigCredentials }}
{{- $cfg := .Values.synapse.config | default "" }}
{{- range $field := list "api_key" "secret_key" "jwt_secret" }}
  {{- range $line := splitList "\n" $cfg }}
    {{- $t := trim $line }}
    {{- if and (hasPrefix (printf "%s:" $field) $t) (not (regexMatch (printf "^%s:\\s*(\"\"|''|null)?$" $field) $t)) }}
      {{- fail (printf "SECURITY: `%s` is set inside synapse.config, which renders into a ConfigMap (world-readable in the namespace, copied into last-applied-configuration, and returned by `helm get values`). Blank it there and inject it via the `secrets` values instead - env vars override config.yaml, so the value still reaches synapse. If you cannot migrate yet, set `allowConfigCredentials: true` to acknowledge the exposure. Offending line: %q" $field $t) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}

{{- /*
NetVarsResolver reads and rewrites config.yaml in a ConfigMap only
(netvars_resolver.go: `var cm corev1.ConfigMap` ... `r.Update(ctx, &cm)`).
With config.yaml in a Secret it finds nothing to rewrite and silently stops
filling ids.address_vars.HOME_NET/EXTERNAL_NET.

That is not cosmetic: HOME_NET is what keeps inline IDS blocking from banning
an internal or cluster source IP. Failing beats discovering it from a banned
node, so refuse the combination.
*/ -}}
{{- if .Values.synapse.configSecret }}
  {{- $labels := .Values.configMapExtraLabels | default dict }}
  {{- if eq (toString (index $labels "synapse.gen0sec.com/resolve-netvars")) "true" }}
    {{- fail "`synapse.configSecret` cannot be combined with the `synapse.gen0sec.com/resolve-netvars` label: the operator's NetVarsResolver only reads and rewrites config.yaml inside a ConfigMap, so with config.yaml in a Secret it would silently stop filling ids.address_vars.HOME_NET/EXTERNAL_NET - and an unfilled HOME_NET lets inline IDS blocking ban internal source IPs. Either leave configSecret off, or drop the resolve-netvars label and set HOME_NET explicitly." }}
  {{- end }}
{{- end }}
