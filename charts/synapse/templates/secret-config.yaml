{{- if .Values.synapse.configSecret }}
{{- /*
The whole config.yaml, in a Secret rather than a ConfigMap.

Env injection (see `secrets`) only reaches fields synapse exposes an env
override for. It does NOT reach the three `headers` maps - telemetry
exporter, geoip sources, threat/download source - which exist to carry
per-endpoint credentials (`Authorization: Bearer ...`). Those have no env
override and config.yaml has no ${VAR} interpolation, so the only way to keep
them out of a world-readable object is to move the file itself.

synapse reads a path; it does not care whether the bytes come from a
ConfigMap or a Secret, so this needs no synapse change.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synapse.fullname" . }}-config
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    {{- with .Values.configMapExtraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configMapExtraAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.yaml: |
{{ .Values.synapse.config | nindent 4 }}
{{- end }}
