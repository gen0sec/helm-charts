{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- /*
Credentials belong in a Secret, not in the rendered config.yaml ConfigMap.

A value templated into config.yaml is readable by anyone with `get configmap`
in the namespace, is copied verbatim into the
kubectl.kubernetes.io/last-applied-configuration annotation, and comes back
out of `helm get values`. None of that is true of a Secret reference.

Prefer `secrets.existingSecret` and manage the Secret out of band (External
Secrets, sealed-secrets, Vault). This block exists so the chart is usable
without that machinery - it is still better than a ConfigMap, but the values
file then holds the credential.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synapse.fullname" . }}-credentials
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
  Keys are the env var names synapse reads (crates/synapse-core cli.rs).
  Empty entries are omitted so an unset credential does not shadow a value
  set elsewhere.
  */ -}}
  {{- with .Values.secrets.apiKey }}
  API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.captchaSecretKey }}
  CAPTCHA_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.captchaJwtSecret }}
  CAPTCHA_JWT_SECRET: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
