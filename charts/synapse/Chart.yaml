apiVersion: v2
name: synapse
description: A Helm chart for Synapse reverse proxy with security features
type: application

# Bumped: optional bundled cert-manager for the proxy (off by default).
version: 0.10.0
appVersion: "0.8.3"

dependencies:
  - name: dragonfly
    version: v2.0.0
    repository: oci://ghcr.io/dragonflydb/dragonfly/helm
    # Gated, unlike the valkey dependency it replaces. Without a condition a
    # dependency deploys unconditionally, so `valkey.enabled: false` was
    # silently ignored and every release got a Redis it did not use.
    condition: dragonfly.enabled
  - name: cert-manager
    version: v1.21.2
    repository: https://charts.jetstack.io
    # Gated for the same reason as dragonfly, and it matters more here: this
    # chart is aliased twice by synapse-stack, and cert-manager is a
    # cluster-scoped operator. Only the proxy terminates TLS, so only the
    # proxy alias should ever enable it. See `cert-manager` in values.yaml.
    condition: cert-manager.enabled
