apiVersion: v2
name: synapse
description: A Helm chart for Synapse reverse proxy with security features
type: application

# Bumped: enabling the bundled Dragonfly now points synapse at it
# (REDIS_URL is injected), and the new `redis.autoWire` key controls that.
# Previous releases deployed a store nothing could reach. appVersion now
# tracks the current synapse release rather than pinning installs to 0.7.0.
version: 0.8.1
appVersion: "0.8.3"

dependencies:
  - name: dragonfly
    version: v1.40.1
    repository: oci://ghcr.io/dragonflydb/dragonfly/helm
    # Gated, unlike the valkey dependency it replaces. Without a condition a
    # dependency deploys unconditionally, so `valkey.enabled: false` was
    # silently ignored and every release got a Redis it did not use.
    condition: dragonfly.enabled
