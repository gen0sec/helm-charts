apiVersion: v2
name: synapse
description: A Helm chart for Synapse reverse proxy with security features
type: application

# Bumped: optional projected upstreams mount (synapse.upstreamsConfigMap) so
# the proxy can read operator-resolved ClusterIP upstreams — see
# templates/deployment.yaml.
version: 0.4.0
appVersion: "0.7.0"

dependencies:
  - name: valkey
    version: 0.7.7
    repository: https://valkey.io/valkey-helm/
  - name: clamav
    version: 1.6.82
    repository: oci://registry.gitlab.com/xrow-public/helm-clamav/charts
    condition: clamavIntegration.enabled
