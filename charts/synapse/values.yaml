# Default values for synapse
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Workload kind: "Deployment" (default) or "DaemonSet".
# DaemonSet is intended for the agent role (one pod per node, XDP on host NIC);
# `replicaCount`, `autoscaling`, and `strategy` are ignored when kind=DaemonSet.
kind: Deployment

replicaCount: 1

# DaemonSet rollout strategy (only honoured when kind=DaemonSet).
updateStrategy: {}

image:
  repository: ghcr.io/gen0sec/synapse
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Extra labels/annotations on the rendered config ConfigMap. The agent
# instance sets `synapse.gen0sec.com/resolve-netvars: "true"` here so the
# operator's NetVarsResolver fills the IDS HOME_NET/EXTERNAL_NET.
configMapExtraLabels: {}
configMapExtraAnnotations: {}

# Command-line arguments passed to the synapse binary.
# By default we point to the rendered ConfigMap at /etc/synapse/config.yaml.
args:
  - "--config"
  - "/etc/synapse/config.yaml"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Pod security context for BPF/XDP access
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  fsGroup: 0

# Container security context
securityContext:
  privileged: true
  capabilities:
    add:
      - SYS_ADMIN
      - NET_ADMIN
      - BPF
      - SYS_RESOURCE
    drop:
      - ALL

# Use host networking when attaching XDP to a host interface.
hostNetwork: false
# Optional override when hostNetwork is true (defaults to ClusterFirstWithHostNet).
dnsPolicy: ""

service:
  type: ClusterIP
  httpPort: 80
  httpsPort: 443
  healthPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules: []

# Synapse configuration files rendered into the ConfigMap.
# Note: YAML config has higher priority than env vars, so leave values empty
# if you plan to override via environment variables.
synapse:
  config: |
    mode: "proxy"

    network:
      # "auto" attaches XDP only to physical uplink interfaces; set an explicit
      # name or use `ifaces` to target a specific/virtual (CNI) interface.
      iface: "auto"
      ifaces: []
      ip_version: "auto"

    # JA4+ fingerprint packet capture backend.
    capture:
      enabled: true
      mode: auto            # auto, xdp, af_packet, af_packet_recv, pfring
      snaplen: 65535
      filter: "tcp"

    firewall:
      mode: "auto"          # auto, xdp, nftables, iptables, none

    # Inline IDS (Thalamus engine)
    ids:
      enabled: true
      capture_mode: xdp
      rule_paths:
        - "/etc/synapse/rules/*.rules"
      enforce_block: true

    # ML classifier (requires the -ml image variant)
    classifier:
      enabled: false
      model_path: ""
      cache_size: 10000
      threshold: 0.5

    platform:
      api_key: ""
      base_url: "https://api.gen0sec.com/v1"
      # Renamed from log_sending_enabled (env override: LOG_SENDING_ENABLED)
      telemetry_sending_enabled: true
      include_response_body: true
      max_body_size: 1048576
      threat:
        enabled: true
        url: "https://download.gen0sec.com/v1"
        path: "/var/lib/synapse"
        refresh_secs: 300
      # Combined IPinfo Lite DB (country + ASN); asn/city unused with it.
      geoip:
        enabled: true
        country:
          url: "https://github.com/gen0sec/geoip-databases/raw/download/ipinfo_lite.mmdb"
          path: "/var/lib/synapse/ipinfo_lite.mmdb"
          headers: null
        asn:  { url: "", path: "", headers: null }
        city: { url: "", path: "", headers: null }
        refresh_secs: 28800

    logging:
      level: "info"
      # Log to stdout for `kubectl logs` (container best practice).
      file_logging_enabled: false
      # Unified fingerprint/BPF event log (replaces the deprecated per-type
      # bpf_stats / tcp_fingerprint / ... sections).
      fingerprint_log:
        enabled: true

    # Foreground in containers — k8s manages the process lifecycle.
    daemon:
      enabled: false

    proxy:
      address_http: "0.0.0.0:80"
      address_tls: "0.0.0.0:443"
      certificates: "/etc/synapse/certs"
      tls_grade: "medium"            # high, medium, unsafe
      default_certificate: "default"
      h2c: true
      allow_connect_method_proxying: false
      keepalive_request_limit: null
      redis:
        url: "redis://127.0.0.1:6379/0"
        prefix: "g0s:synapse"
      upstream:
        conf: "/etc/synapse/upstreams.yaml"
        healthcheck:
          method: "HEAD"
          interval: 2
      protocol:
        enabled: false
        timeout_ms: 1000
      captcha:
        site_key: null
        secret_key: null
        jwt_secret: null
        provider: "hcaptcha"          # hcaptcha, recaptcha, turnstile, prosopo
        token_ttl: 7200
        cache_ttl: 300
      acme:
        enabled: false
        port: 9180
        email: null
        storage_type: null            # "file" or "redis"
        storage_path: "/var/lib/synapse/acme"
        development: false
        redis_url: null
      content_scanning:
        enabled: false
        clamav_server: "localhost:3310"
        max_file_size: 10485760
        scan_content_types:
          - "text/html"
          - "application/x-www-form-urlencoded"
          - "multipart/form-data"
          - "application/json"
          - "text/plain"
        skip_extensions: []
        scan_expression: "http.request.method eq \"POST\" or http.request.method eq \"PUT\""
      internal_services:
        enabled: true
        port: 9180
        bind_ip: "127.0.0.1"

  upstreams: |
    provider: "file"
    config:
      sticky_sessions: false
    upstreams:
      example.com:
        paths:
          "/":
            servers:
              - "127.0.0.1:8081"

# Environment variable overrides (lowest priority; use only for settings not in config.yaml)
# SYNAPSE_LOG_FORMAT=json is the chart default so every workload (proxy + agent)
# emits structured JSON console logs; override per-workload (e.g. proxy.env) to change.
env:
  SYNAPSE_LOG_FORMAT: json

resources: {}

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
# - name: bpf
#   hostPath:
#     path: /sys/fs/bpf
#     type: DirectoryOrCreate
# - name: modules
#   hostPath:
#     path: /lib/modules
#     type: Directory

volumeMounts: []
# - name: bpf
#   mountPath: /sys/fs/bpf

# Additional sidecar containers to run alongside synapse in the same pod.
# Used to inject the synapse-operator running in --ingress-mode, which
# renders Ingress/HTTPRoute resources into a shared upstreams.yaml that
# synapse hot-reloads via SIGHUP. The list is rendered verbatim into the
# pod template's `containers:` array.
extraContainers: []

# Share the PID namespace across containers in the pod. Required when an
# operator sidecar is used in --ingress-mode so it can send SIGHUP to the
# co-located synapse process (`--reload-process-name synapse`).
shareProcessNamespace: false
# - name: modules
#   mountPath: /lib/modules
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

valkey: {}

clamavIntegration:
  enabled: true

clamav:
  image:
    registry: docker.io
    repository: clamav/clamav-debian
    tag: "1.5.1"
    pullPolicy: IfNotPresent
