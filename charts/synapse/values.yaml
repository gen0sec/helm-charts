# Default values for synapse
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Workload kind: "Deployment" (default) or "DaemonSet".
# DaemonSet is intended for the agent role (one pod per node, XDP on host NIC);
# `replicaCount`, `autoscaling`, and `strategy` are ignored when kind=DaemonSet.
kind: Deployment

replicaCount: 1

# DaemonSet rollout strategy (only honoured when kind=DaemonSet).
updateStrategy: {}

image:
  repository: ghcr.io/gen0sec/synapse
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Extra labels/annotations on the rendered config ConfigMap. The agent
# instance sets `synapse.gen0sec.com/resolve-netvars: "true"` here so the
# operator's NetVarsResolver fills the IDS HOME_NET/EXTERNAL_NET.
configMapExtraLabels: {}
configMapExtraAnnotations: {}

# Command-line arguments passed to the synapse binary.
# By default we point to the rendered ConfigMap at /etc/synapse/config.yaml.
args:
  - "--config"
  - "/etc/synapse/config.yaml"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Pod security context for BPF/XDP access
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  fsGroup: 0

# Container security context
securityContext:
  privileged: true
  capabilities:
    add:
      - SYS_ADMIN
      - NET_ADMIN
      - BPF
      - SYS_RESOURCE
    drop:
      - ALL

# Use host networking when attaching XDP to a host interface.
hostNetwork: false
# Optional override when hostNetwork is true (defaults to ClusterFirstWithHostNet).
dnsPolicy: ""

service:
  type: ClusterIP
  httpPort: 80
  httpsPort: 443
  # The container port the health listener uses. Still declared on the Pod, and
  # still what a probe would target -- this only names the port, it does not
  # publish it.
  healthPort: 8080
  # Publish healthPort on the Service. Off by default, and you almost certainly
  # want it off.
  #
  # The health endpoint binds LOOPBACK inside the container (NOTES.txt has always
  # said `http://localhost:8080/health`), so a Service port pointing at it never
  # routes: a request to the Pod IP on this port is refused, not answered. That
  # makes the published port useless on `type: ClusterIP` and actively harmful on
  # `type: LoadBalancer`, where the cloud controller turns every Service port into
  # a listener AND opens the load balancer's security group to 0.0.0.0/0 for it --
  # an internet-facing listener to nothing, on a port that reads as an
  # administrative endpoint to anyone scanning.
  #
  # The default probes below target this port and so would fail; a chart consumer
  # has to repoint them at httpPort, which is the giveaway that nothing serves
  # this port on a routable address.
  exposeHealth: false
  # Source-IP preservation for externally-reachable Services. Empty leaves the
  # field unset, so Kubernetes applies its own default of `Cluster`.
  #
  # Under `Cluster` every node accepts the traffic and forwards it on, SNATing
  # to a node-local address on the way. The proxy then sees the CNI gateway --
  # not the caller -- so `X-Forwarded-For`, the access log, the IDS HOME_NET
  # checks and any source-IP firewall rule all observe an internal address and
  # are effectively blind. `Local` drops the extra hop and hands the socket the
  # real client address.
  #
  # `Local` also means a node with no ready pod stops answering, which is what
  # makes the cloud health check route traffic away from it -- fine for the
  # DaemonSet deployment, and for a Deployment it is worth pairing with a
  # spread constraint so every advertised node actually has a replica.
  #
  # Only `LoadBalancer` and `NodePort` accept this field; the API server
  # rejects it outright on a `ClusterIP` Service, so the template applies it
  # only for those two types.
  externalTrafficPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules: []

# Credentials. Injected as env vars from a Secret, NOT templated into the
# config.yaml ConfigMap.
#
# Why this exists: anything placed in `synapse.config` is rendered into a
# ConfigMap, which is readable by anyone with `get configmap` in the
# namespace, is copied verbatim into the last-applied-configuration
# annotation, and is returned by `helm get values`. Credentials do not belong
# there.
#
# This works because synapse applies env overrides AFTER parsing config.yaml
# and assigns unconditionally (cli.rs `apply_env_overrides`), so an env var
# wins over the file. Leave the corresponding config.yaml fields empty.
#
# PREFERRED: manage the Secret out of band (External Secrets, sealed-secrets,
# Vault) and reference it, so no credential is ever in values:
#   secrets:
#     existingSecret: synapse-credentials
#
# The Secret's keys must be the env var names synapse reads:
#   API_KEY, CAPTCHA_SECRET_KEY, CAPTCHA_JWT_SECRET
secrets:
  # Reference an externally-managed Secret. Takes precedence over `create`.
  existingSecret: ""
  # Render a Secret from the values below. Better than a ConfigMap, but the
  # credential then lives in your values file - prefer existingSecret.
  create: false
  apiKey: ""
  captchaSecretKey: ""
  captchaJwtSecret: ""
  # Any additional env-var-name -> value pairs to include in the Secret.
  extra: {}

# Synapse configuration files rendered into the ConfigMap.
# Note: env vars WIN over this file. synapse parses config.yaml and then runs
# apply_env_overrides, which assigns unconditionally - so an env var
# overrides whatever is set here. Leave credential fields empty and inject
# them via `secrets` above.
synapse:
  # Optional: name of a ConfigMap (same namespace) whose `upstreams.yaml`
  # key holds upstreams with their server addresses already resolved to
  # ClusterIP literals — produced by the synapse-operator DNS->IP
  # UpstreamsResolverReconciler (label the source CM with
  # `synapse.gen0sec.com/resolve-upstreams: "true"` and annotate it with
  # `synapse.gen0sec.com/resolved-configmap: <thisName>` via
  # configMapExtraLabels/configMapExtraAnnotations).
  #
  # When set, the proxy mounts config.yaml from the chart's ConfigMap but
  # upstreams.yaml from THIS ConfigMap, so `upstream_peer` is handed IP
  # literals and never resolves an upstream hostname on the request path.
  # When empty (default) the proxy mounts the chart's ConfigMap as-is
  # (hostname upstreams; the in-proxy dns_cache handles resolution).
  upstreamsConfigMap: ""

  # Render config.yaml into a Secret instead of a ConfigMap.
  #
  # The `secrets` block above only reaches fields synapse exposes an env
  # override for. It does NOT reach the three `headers` maps - telemetry
  # exporter, geoip sources (country/asn/city), threat/download source -
  # which exist to carry per-endpoint credentials
  # (`Authorization: "Bearer ..."`). Those have no env override, and
  # config.yaml has no ${VAR} interpolation, so a per-endpoint key can only be
  # written into the file. Set this when any of them carries a credential.
  #
  # synapse reads a path and does not care whether the bytes come from a
  # ConfigMap or a Secret, so this needs no synapse change. upstreams.yaml is
  # not sensitive and stays a ConfigMap so the operator can keep owning it.
  #
  # INCOMPATIBLE with the operator's NetVarsResolver, which reads and rewrites
  # config.yaml in a ConfigMap only (netvars_resolver.go takes a
  # corev1.ConfigMap). With this on, HOME_NET/EXTERNAL_NET auto-fill stops -
  # which matters, because that is what keeps inline IDS blocking from banning
  # an internal source IP. The chart refuses the combination rather than
  # letting it fail quietly.
  configSecret: false
  config: |
    mode: "proxy"

    network:
      # "auto" attaches XDP only to physical uplink interfaces; set an explicit
      # name or use `ifaces` to target a specific/virtual (CNI) interface.
      iface: "auto"
      ifaces: []
      ip_version: "auto"

    # JA4+ fingerprint packet capture backend.
    capture:
      enabled: true
      mode: auto            # auto, xdp, af_packet, af_packet_recv, pfring
      snaplen: 65535
      filter: "tcp"

    firewall:
      mode: "auto"          # auto, xdp, nftables, iptables, none

    # Inline IDS (Thalamus engine)
    ids:
      enabled: true
      capture_mode: xdp
      rule_paths:
        - "/etc/synapse/rules/*.rules"
      enforce_block: true

    # ML classifier (requires the -ml image variant)
    classifier:
      enabled: false
      model_path: ""
      cache_size: 10000
      threshold: 0.5

    platform:
      api_key: ""
      base_url: "https://api.gen0sec.com/v1"
      # Renamed from log_sending_enabled (env override: LOG_SENDING_ENABLED)
      telemetry_sending_enabled: true
      include_response_body: true
      max_body_size: 1048576
      threat:
        enabled: true
        url: "https://download.gen0sec.com/v1"
        path: "/var/lib/synapse"
        refresh_secs: 300
      # Combined IPinfo Lite DB (country + ASN); asn/city unused with it.
      geoip:
        enabled: true
        country:
          url: "https://github.com/gen0sec/geoip-databases/raw/download/ipinfo_lite.mmdb"
          path: "/var/lib/synapse/ipinfo_lite.mmdb"
          headers: null
        asn:  { url: "", path: "", headers: null }
        city: { url: "", path: "", headers: null }
        refresh_secs: 28800

    logging:
      level: "info"
      # Log to stdout for `kubectl logs` (container best practice).
      file_logging_enabled: false
      # Unified fingerprint/BPF event log (replaces the deprecated per-type
      # bpf_stats / tcp_fingerprint / ... sections).
      fingerprint_log:
        enabled: true

    # Foreground in containers — k8s manages the process lifecycle.
    daemon:
      enabled: false

    proxy:
      address_http: "0.0.0.0:80"
      address_tls: "0.0.0.0:443"
      certificates: "/etc/synapse/certs"
      tls_grade: "medium"            # high, medium, unsafe
      default_certificate: "default"
      h2c: true
      allow_connect_method_proxying: false
      keepalive_request_limit: null
      redis:
        url: "redis://127.0.0.1:6379/0"
        prefix: "g0s:synapse"
      upstream:
        conf: "/etc/synapse/upstreams.yaml"
        healthcheck:
          method: "HEAD"
          interval: 2
      protocol:
        enabled: false
        timeout_ms: 1000
      captcha:
        site_key: null
        secret_key: null
        jwt_secret: null
        provider: "hcaptcha"          # hcaptcha, recaptcha, turnstile, prosopo
        token_ttl: 7200
        cache_ttl: 300
      acme:
        enabled: false
        port: 9180
        email: null
        storage_type: null            # "file" or "redis"
        storage_path: "/var/lib/synapse/acme"
        development: false
        redis_url: null
      # Content scanning is RULE-DRIVEN: enabling the scanner selects no
      # traffic on its own. A request-phase WAF rule with the
      # `content_scanning` action is the selector. That action is terminal
      # under first-match-wins, so order content-scan rules after the block
      # rules that should take precedence.
      content_scanning:
        enabled: false
        clamav_server: "localhost:3310"
        # Bytes. A body over this is "unscannable" - see below.
        max_file_size: 10485760
        # What to do with a selected request whose body cannot be inspected:
        #   block (default) - refuse it with 413
        #   pass            - forward it unscanned, logging each time
        unscannable: block
        # Ceiling on body memory held across all in-flight scans (256MB).
        # A scanned body is held until ClamAV answers, so without this
        # max_file_size x concurrent uploads is an OOM. Requests over the
        # ceiling are not refused - they fall back to scanning while the body
        # streams, so a hit still blocks but the bytes reach the backend.
        scan_memory_budget: 268435456
        # How long a verdict is reused for an identical body, in seconds.
        # Bounded because a "clean" verdict is only as good as the signature
        # database behind it. Failed scans are never cached. 0 disables.
        verdict_cache_ttl_secs: 300
        # How many verdicts to retain. Applied when the scanner is built, so
        # a change here takes effect on restart.
        verdict_cache_entries: 8192
      internal_services:
        enabled: true
        port: 9180
        bind_ip: "127.0.0.1"

  upstreams: |
    provider: "file"
    config:
      sticky_sessions: false
    upstreams:
      example.com:
        paths:
          "/":
            servers:
              - "127.0.0.1:8081"

# Environment variables rendered as literal name/value pairs. These take
# precedence over config.yaml (see the note above), but they land in the
# Deployment spec in plaintext - do NOT put credentials here, use `secrets`.
# SYNAPSE_LOG_FORMAT=json is the chart default so every workload (proxy + agent)
# emits structured JSON console logs; override per-workload (e.g. proxy.env) to change.
env:
  SYNAPSE_LOG_FORMAT: json

resources: {}

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
# - name: bpf
#   hostPath:
#     path: /sys/fs/bpf
#     type: DirectoryOrCreate
# - name: modules
#   hostPath:
#     path: /lib/modules
#     type: Directory

volumeMounts: []
# - name: bpf
#   mountPath: /sys/fs/bpf

# RBAC for the operator's `--config-sync` reload sidecar. Enable alongside
# the initContainers/extraContainers wiring; see the synapse-stack
# config-sync example values. The sidecar reads the rendered ConfigMap
# straight from the API, which is what makes delivery sub-second instead of
# waiting on kubelet's mount sync loop.
configSync:
  rbac:
    create: false

# Init containers, rendered verbatim into the pod template. Used to prime the
# shared config volume BEFORE synapse starts: synapse-proxy does a blocking
# initial read of its upstreams file and, if that read fails, aborts its whole
# background service without ever establishing a file watch — so a pod that
# starts before the file exists stays deaf to every later update rather than
# recovering. The operator's `--config-sync --sync-once` mode is the intended
# occupant.
initContainers: []

# Additional sidecar containers to run alongside synapse in the same pod.
# Used to inject the synapse-operator running in --ingress-mode, which
# renders Ingress/HTTPRoute resources into a shared upstreams.yaml that
# synapse hot-reloads via SIGHUP. The list is rendered verbatim into the
# pod template's `containers:` array.
extraContainers: []

# Share the PID namespace across containers in the pod. Required when an
# operator sidecar is used in --ingress-mode so it can send SIGHUP to the
# co-located synapse process (`--reload-process-name synapse`).
shareProcessNamespace: false
# - name: modules
#   mountPath: /lib/modules
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Optional bundled Redis-compatible store (Dragonfly), for the synapse features
# that need one: ACME certificate storage (`proxy.acme.storage_type: redis`),
# the WAF captcha token store, and cross-node WAF penalty sync
# (`proxy.penalty_sync.enabled`). OFF by default.
#
# Turning this on auto-wires the proxy at it: the chart injects
# `REDIS_URL=redis://<dragonfly-service>:6379/0` so the store is actually used
# rather than deployed and ignored. See `redis.autoWire` below for when that is
# suppressed. The shipped `proxy.redis.url` placeholder points at 127.0.0.1,
# where nothing listens, so before this the bundled store was unreachable
# unless you also hand-edited the config.
#
# Install this chart TWICE (e.g. the proxy and agent aliases of synapse-stack)
# with Dragonfly on in both and the two instances collide: `dragonfly.fullname`
# derives from the release name, which both share, so they render the same
# ServiceAccount/Service/Deployment. Give at least one a `fullnameOverride`.
# The agent has no Redis-backed feature at all, so the usual answer is to leave
# it off there.
#
# NOTE if you enable `storage`: Dragonfly's default `dbfilename` embeds a
# timestamp (`dump-{timestamp}`), so every snapshot lands as a NEW file and
# nothing ever prunes them — there is no retention setting. Pin a static name
# via extraArgs, e.g. `--dbfilename=dump`, or the volume fills up.
dragonfly:
  enabled: false
  # fullnameOverride: synapse-proxy-dragonfly

# Bundled cert-manager, for issuing the proxy's TLS certificates with
# Certificate/Issuer resources instead of synapse's built-in ACME client
# (`synapse.config.proxy.acme`). Pick one: both answer the same question, and
# running them together means two things renewing the same hostname.
#
# OFF by default, and it must stay off on the agent — the agent has no TLS
# listener, and cert-manager is a CLUSTER-scoped operator. Enabling it on both
# aliases does not fail loudly: the workloads get distinct names, then contend
# where it is not visible. Both take the same fixed leader-election leases in
# kube-system (so one controller sits idle), both register webhooks over the
# cert-manager API group, and both reconcile the same cluster-wide CRDs.
#
# As with dragonfly, set a distinct `fullnameOverride` on whichever alias
# enables it — the two aliases share a release name, so the default names are
# release-derived and identical.
#
# CRDs ARE NOT INSTALLED HERE. `crds.enabled` stays at cert-manager's own
# default of false, deliberately:
#
#   - CRD names are fixed (`certificates.cert-manager.io` and friends) and are
#     the one part of this chart `fullnameOverride` cannot disambiguate, so a
#     release that owns them collides with any cert-manager already running.
#   - Helm would tie them to THIS release. Uninstalling synapse would then
#     take the CRDs with it, and deleting a CRD deletes every Certificate in
#     the cluster — including ones this release never issued.
#
# Install the CRDs out-of-band once per cluster, and keep them there:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.crds.yaml
#
# If cert-manager is already running in the cluster, leave this off and just
# point Issuers at it — you do not need a second controller.
# NOTE the key is `cert-manager`, matching the dependency name in Chart.yaml.
# Helm routes subchart values by dependency name, so a `certManager:` block
# would gate nothing and silently drop every override inside it.
cert-manager:
  enabled: false
  # fullnameOverride: synapse-proxy-cert-manager

redis:
  # Inject REDIS_URL pointing at the bundled Dragonfly when it is enabled.
  #
  # Suppressed automatically — no need to touch this — when you have already
  # said where Redis lives, either via `env.REDIS_URL` or by setting
  # `proxy.redis.url` in `synapse.config` to anything but the shipped
  # localhost placeholder. That second case is why the chart looks inside the
  # config at all: env overrides are applied after the file is parsed and
  # assign unconditionally, so an unconditional inject would quietly replace a
  # URL you had chosen.
  #
  # Set false to opt out entirely and manage the URL yourself.
  autoWire: true

# Deploy a bundled clamd for `proxy.content_scanning`. OFF by default: the
# shipped config sets `content_scanning.enabled: false`, so a default install
# would run a clamd nothing talks to. The agent never has a content-scanning
# path at all.
#
# Turn this on together with `content_scanning.enabled` in `synapse.config`,
# and point `content_scanning.clamav_server` at the rendered Service:
#   clamav_server: "<release>-synapse-clamav:3310"
clamavIntegration:
  enabled: false

clamav:
  image:
    registry: docker.io
    repository: clamav/clamav-debian
    tag: "1.5.1"
    pullPolicy: IfNotPresent

  # The image starts as root and drops privileges in its own entrypoint.
  # runAsNonRoot makes the kubelet refuse the container outright
  # ("container has runAsNonRoot and image will run as root"), and dropping
  # ALL capabilities breaks the entrypoint's chown of /run/clamav
  # ("cannot change owner and permissions of '/run/clamav'").
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]

  service:
    port: 3310

  # Loading the signature set on a cold start is slow, and a startupProbe
  # that expires mid-load gets clamd SIGKILLed (exit 137) right as it
  # finishes - which reads as a crashloop rather than a slow start.
  # 90 x 10s = 15 minutes of grace; liveness only applies afterwards.
  startupProbe:
    periodSeconds: 10
    failureThreshold: 90
  livenessProbe:
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    periodSeconds: 10
    failureThreshold: 3

  # Signature database. emptyDir means a full re-download on every restart
  # (a few hundred MB); swap for a PVC if that matters.
  signatureVolume:
    emptyDir: {}

  streamMaxLength: 1000M
  debug: false

  resources: {}
  nodeSelector: {}
  tolerations: []
