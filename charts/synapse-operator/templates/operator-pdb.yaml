{{/*
PodDisruptionBudget — explicit opt-in via `pdb.create=true`,
OR auto-enabled when replicaCount > 1. Single-replica deploys can't
honour a PDB (eviction would always violate it), so we leave the
default off and only render when there's room for HA semantics.
*/}}
{{- $pdbEnabled := or .Values.pdb.create (gt (.Values.replicaCount | int) 1) -}}
{{- if and .Values.enabled $pdbEnabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "synapse-operator.fullname" . }}
  namespace: {{ .Values.global.namespaces.operator }}
  labels:
    {{- include "synapse-operator.labels" . | nindent 4 }}
spec:
  {{- if .Values.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "synapse-operator.selectorLabels" . | nindent 6 }}
{{- end }}
