{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse-operator.fullname" . }}
  namespace: {{ .Values.global.namespaces.operator }}
  labels:
    {{- include "synapse-operator.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "synapse-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synapse-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "synapse-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElect }}
            - --leader-elect
            {{- end }}
            {{- with .Values.leaderElectionNamespace }}
            - --leader-election-namespace={{ . }}
            {{- end }}
            {{- if .Values.metricsBindAddress }}
            - --metrics-bind-address={{ .Values.metricsBindAddress }}
            {{- end }}
            {{- if .Values.healthProbeBindAddress }}
            - --health-probe-bind-address={{ .Values.healthProbeBindAddress }}
            {{- end }}
            {{- with .Values.watchNamespace }}
            - --namespace={{ . }}
            {{- end }}
            {{- if .Values.labelSelector }}
            - --label-selector={{ .Values.labelSelector }}
            {{- end }}
            {{- if .Values.configHashAnnotation }}
            - --config-hash-annotation={{ .Values.configHashAnnotation }}
            {{- end }}
            {{- if .Values.ignoreConfigMapKeys }}
            - --ignore-configmap-keys={{ .Values.ignoreConfigMapKeys }}
            {{- end }}
            {{- if .Values.ignoreSecretKeys }}
            - --ignore-secret-keys={{ .Values.ignoreSecretKeys }}
            {{- end }}
            {{- if .Values.ingressMode }}
            - --ingress-mode
            {{- end }}
            {{- if .Values.ingressClass }}
            - --ingress-class={{ .Values.ingressClass }}
            {{- end }}
            {{- if .Values.upstreamsOutConfigMap }}
            - --upstreams-out-configmap={{ .Values.upstreamsOutConfigMap }}
            {{- end }}
            {{- if .Values.resolveBackendClusterIPs }}
            - --resolve-backend-cluster-ips
            {{- end }}
            {{- if .Values.resolveBackendEndpoints }}
            - --resolve-backend-endpoints
            {{- end }}
            {{- if .Values.gatewayAPI }}
            - --gateway-api
            {{- end }}
            {{- if .Values.upstreamsResolver }}
            - --upstreams-resolver
            {{- end }}
            {{- if .Values.netvarsResolver }}
            - --netvars-resolver
            {{- end }}
            {{- if .Values.idsHotReloadHashExclude }}
            - --ids-hot-reload-hash-exclude
            {{- end }}
            {{- if .Values.perWorkloadConfigHash }}
            - --per-workload-config-hash
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.ports.metrics }}
              name: metrics
              protocol: TCP
            - containerPort: {{ .Values.ports.healthz }}
              name: healthz
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # readOnlyRootFilesystem requires /tmp to be writable elsewhere
        # (controller-runtime writes a workspace file during leader
        # election bootstrap). An emptyDir keeps the rootfs sealed.
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
