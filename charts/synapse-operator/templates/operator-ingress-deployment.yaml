{{- if and .Values.enabled .Values.ingress.enabled }}
# Second operator Deployment running in --ingress-mode (central layout):
# watches synapse-class Ingresses cluster-wide and renders the proxy's
# upstreams.yaml ConfigMap key. It runs ALONGSIDE the config-hash operator
# (operator-deployment.yaml) — ingress-mode replaces config-hash within a
# single process, so the two responsibilities are separate Deployments
# sharing one ServiceAccount/RBAC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse-operator.ingressFullname" . }}
  namespace: {{ .Values.global.namespaces.operator }}
  labels:
    {{- include "synapse-operator.ingressLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingress.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "synapse-operator.ingressSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synapse-operator.ingressLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "synapse-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No --namespace flag: ingresses + backend Services live in
          # arbitrary namespaces, so the watch must be cluster-wide.
          args:
            - --ingress-mode
            - --ingress-class={{ .Values.ingress.ingressClass }}
            - --upstreams-out-configmap={{ .Values.ingress.upstreamsOutConfigMap }}
            - --cluster-domain={{ .Values.ingress.clusterDomain }}
            {{- if .Values.ingress.resolveBackendClusterIPs }}
            - --resolve-backend-cluster-ips
            {{- end }}
            {{- if .Values.ingress.resolveBackendEndpoints }}
            - --resolve-backend-endpoints
            {{- end }}
            {{- if .Values.ingress.gatewayAPI }}
            - --gateway-api
            {{- end }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- with .Values.ingress.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ingress.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem requires /tmp to be writable elsewhere.
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
