{{- if and .Values.operator.enabled .Values.operator.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "synapse-operator.fullname" . }}
  labels:
    {{- include "synapse-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    # Ingress-mode writes the rendered upstreams ConfigMap; the
    # UpstreamsResolver writes `<source>-resolved` siblings. Both
    # need create/update/patch on top of the read verbs.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    # Read TLS Secrets to project Ingress certs; write the operator-owned
    # cert output Secret when --certs-out-secret is set (central mode).
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    # IngressReconciler resolves Service backends → ClusterIPs when
    # `--resolve-backend-cluster-ips` is set; UpstreamsResolver also
    # walks Services to substitute FQDNs.
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    # NetVarsResolver (--netvars-resolver) reads Node IPs + PodCIDRs to
    # auto-fill ids.address_vars.HOME_NET/EXTERNAL_NET.
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
{{- end }}
