apiVersion: v2
name: synapse-operator
description: Helm chart for the Synapse Kubernetes operator
# Release synapse-operator v1.0.0
type: application
# 2.2.0: instanceLabelInSelector (default true, no render change) lets the
# selectors omit app.kubernetes.io/instance, to match an existing release.
#
# 2.1.0: the east-west producers, ported from the synapse-stack's operator
# block with the same keys: identityProducer / edgeProducer {enabled,
# interval}, downloadAPIURL, apiKeySecret {name, key}, plus clusterId
# (--cluster-id). The SYNAPSE_API_KEY env and the pods / namespaces /
# networkpolicies rules appear only while a producer is on, so a default
# render is unchanged. The stack's graphProducer is not ported: the operator
# (v0.1.11, v0.2.0) has no --graph-producer or --service-graph-url flag.
#
# 2.0.1: serviceAccount.create=false with an empty serviceAccount.name now
# fails the render (templates/validate-values.yaml). It used to run the operator
# as the namespace's `default` ServiceAccount and bind the ClusterRole and the
# leader-election Role to it. Setups with rbac.create=false and no name are
# affected too (the pod still ran as `default`). Set serviceAccount.name to an
# existing ServiceAccount, or to `default` if that is intended. Defaults are
# unchanged.
#
# 2.0.0, BREAKING. Every value moved from `operator:` to the top level
# (operator.image.tag -> image.tag, operator.enabled -> enabled), so that this
# chart can sit under `operator:` in the synapse-stack as a subchart. The
# objects rendered are unchanged. A values file that still has an `operator:`
# block now fails the render (templates/validate-values.yaml) instead of being
# ignored. global.namespaces.operator is unchanged.
#
# From 1.6.0: the ingresses/status grant (--publish-status-address was
# forbidden without it) and an opt-in gatewayAPI that drives both the
# --gateway-api flag and its RBAC.
#
# Still from 1.5.1: --resolve-backend-endpoints defaults ON, which requires a
# synapse build with the atomic reload-publication fix; see values.yaml.
version: 2.2.0
appVersion: "0.1.11"
home: https://gen0sec.com
icon: https://raw.githubusercontent.com/gen0sec/helm-charts/main/images/logo.png
sources:
  - https://github.com/gen0sec/synapse-operator
keywords:
  - synapse
  - operator
  - kubernetes
  - security
maintainers:
  - name: Gen0Sec
    email: support@gen0sec.com
