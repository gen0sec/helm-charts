apiVersion: v2
name: synapse-operator
description: Helm chart for the Synapse Kubernetes operator
# Release synapse-operator v1.0.0
type: application
# Bumped: BREAKING. Every value moved from `operator:` to the top level
# (operator.image.tag -> image.tag, operator.enabled -> enabled), so that this
# chart can sit under `operator:` in the synapse-stack as a subchart. The
# objects rendered are unchanged. A values file that still has an `operator:`
# block now fails the render (templates/validate-values.yaml) instead of being
# ignored. global.namespaces.operator is unchanged.
#
# From 1.6.0: the ingresses/status grant (--publish-status-address was
# forbidden without it) and an opt-in gatewayAPI that drives both the
# --gateway-api flag and its RBAC.
#
# Still from 1.5.1: --resolve-backend-endpoints defaults ON, which requires a
# synapse build with the atomic reload-publication fix; see values.yaml.
# 2.2.0: instanceLabelInSelector (default true, no render change) lets the
# selectors omit app.kubernetes.io/instance, to match an existing release.
# 2.3.0: ingress.* renders the ingress-mode companion Deployment
# (<fullname>-ingress) the synapse-stack carries as operator.ingress.*. Off by
# default, so nothing renders differently until ingress.enabled is set.
version: 2.3.0
appVersion: "0.1.11"
home: https://gen0sec.com
icon: https://raw.githubusercontent.com/gen0sec/helm-charts/main/images/logo.png
sources:
  - https://github.com/gen0sec/synapse-operator
keywords:
  - synapse
  - operator
  - kubernetes
  - security
maintainers:
  - name: Gen0Sec
    email: support@gen0sec.com
